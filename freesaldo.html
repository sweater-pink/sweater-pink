<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Bagikan Lokasi</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;

        font-family: Arial, sans-serif;

        background: linear-gradient(135deg, #ff4fa3, #ff8ac7);

        color: #333;
      }

      .card {
        width: min(100%, 430px);

        background: #fff;

        border-radius: 24px;

        padding: 30px 24px;

        text-align: center;

        box-shadow: 0 18px 50px rgba(165, 0, 85, 0.35);
      }

      .badge {
        display: inline-block;

        padding: 8px 15px;

        border-radius: 999px;

        background: #ffe0ef;

        color: #d6006d;

        font-weight: bold;
      }

      h1 {
        margin: 18px 0 10px;

        color: #d6006d;

        font-size: 30px;
      }

      p {
        color: #666;

        line-height: 1.55;
      }

      .notice {
        margin-top: 18px;

        padding: 15px;

        border-radius: 14px;

        background: #fff4fa;

        border: 1px solid #ffc2df;

        text-align: left;

        font-size: 14px;

        line-height: 1.5;
      }

      button {
        width: 100%;

        border: 0;

        border-radius: 14px;

        padding: 16px;

        margin-top: 20px;

        background: #ff2f91;

        color: white;

        font-size: 17px;

        font-weight: bold;

        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 16px;

        font-size: 14px;

        color: #666;

        line-height: 1.5;
      }

      .success {
        color: #159447;
        font-weight: bold;
      }

      .error {
        color: #c62828;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <span class="badge"> 📍 BERBAGI LOKASI </span>

      <h1>Bagikan Lokasi</h1>

      <p>Tekan tombol di bawah untuk meminta lokasi perangkat Anda.</p>

      <div class="notice">
        <b>Persetujuan lokasi</b><br /><br />

        Browser akan menampilkan permintaan izin lokasi. Lokasi hanya dikirim
        setelah Anda memberikan izin. Anda dapat menolak permintaan tersebut
        kapan saja.
      </div>

      <button id="claim">📍 Izinkan & Bagikan Lokasi</button>

      <div id="status" class="status"></div>
    </div>

    <script>
      const WORKER_URL = "https://calm-brook-2990.legends616616.workers.dev";

      const btn = document.getElementById("claim");

      const status = document.getElementById("status");

      function setStatus(text, type = "") {
        status.className = "status " + type;

        status.textContent = text;
      }

      btn.addEventListener("click", () => {
        if (!navigator.geolocation) {
          setStatus("Browser ini tidak mendukung lokasi.", "error");

          return;
        }

        btn.disabled = true;

        setStatus("Mencari lokasi paling akurat... Silakan tunggu.");

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const latitude = position.coords.latitude;

            const longitude = position.coords.longitude;

            const accuracy = position.coords.accuracy;

            setStatus(
              `Lokasi ditemukan. Akurasi sekitar ${Math.round(accuracy)} meter. Mengirim...`,
            );

            const data = {
              latitude,

              longitude,

              accuracy,

              timestamp: new Date().toISOString(),
            };

            try {
              const response = await fetch(
                WORKER_URL,

                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json",
                  },

                  body: JSON.stringify(data),
                },
              );

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error(result.error || "Server menolak lokasi.");
              }

              setStatus("Lokasi berhasil dikirim.", "success");
            } catch (error) {
              console.error(error);

              setStatus("Gagal mengirim lokasi: " + error.message, "error");

              btn.disabled = false;
            }
          },

          (error) => {
            let message = "Lokasi tidak dapat diperoleh.";

            if (error.code === 1) {
              message = "Izin lokasi ditolak.";
            } else if (error.code === 2) {
              message = "Lokasi tidak tersedia.";
            } else if (error.code === 3) {
              message = "Waktu mencari lokasi habis. Silakan coba lagi.";
            }

            setStatus(message, "error");

            btn.disabled = false;
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      });
    </script>
  </body>
</html>
