        font-weight: bold;
      }

      .footer {
        margin-top: 40px;
        text-align: center;
        color: #666;
        font-size: 14px;
      }

      @media (max-width: 700px) {
        .title {
          font-size: 35px;
        }

        .app {

        }

        .icon {

      .modal {

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        justify-content: center;
        align-items: center;
        z-index: 9999;
      }

      .modal-box {

        border-radius: 18px;
        padding: 25px;
        width: 90%;
        max-width: 350px;
        text-align: center;
        box-shadow: 0 0 20px #ff3b8d;

      @keyframes shineText {

    <script>
